<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Ultimate Student Portal</title>

    <!-- Flaticon Uicons -->
    <link rel="stylesheet"
        href="https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css">

    <link rel="stylesheet" href="signup.css">

</head>


<body>


    <!-- MAIN CONTAINER -->

    <div class="container">


        <!-- LOGO / BRAND -->

    <div class="brand">

      <img src="media/usp logo-02.png" alt="">

    </div>


        <!-- HEADING -->

        <div class="heading">

            <h1>Create Your Account</h1>

            <p>Choose how you want to sign up</p>

        </div>


        <!-- ROLE CARDS -->

        <div class="role-container">


            <!-- STUDENT CARD -->

            <a href="student-signup.html" class="role-card student-card">


                <div class="role-icon">

                    <i class="fi fi-rr-graduation-cap"></i>

                </div>


                <h2>
                    Sign up as a
                    <span>Student</span>
                </h2>


                <div class="small-line"></div>


                <p>
                    Access your academic
                    results and keep track of
                    your progress.
                </p>


                <div class="continue-button">

                    Continue as Student

                    <i class="fi fi-rr-arrow-right"></i>

                </div>


            </a>



            <!-- INSTRUCTOR CARD -->

            <a href="ins-signup.html" class="role-card instructor-card">


                <div class="role-icon">

                    <i class="fi fi-rr-chalkboard-user"></i>

                </div>


                <h2>
                    Sign up as an
                    <span>Instructor</span>
                </h2>


                <div class="small-line"></div>


                <p>
                    Manage students, courses
                    and academic results
                    with ease.
                </p>


                <div class="continue-button">

                    Continue as Instructor

                    <i class="fi fi-rr-arrow-right"></i>

                </div>


            </a>


        </div>


        <!-- LOGIN -->

        <div class="login-text">

            Already have an account?

            <a href="login.html">
                Log In
                <i class="fi fi-rr-arrow-right"></i>
            </a>

        </div>


    </div>


</body>

</html>
