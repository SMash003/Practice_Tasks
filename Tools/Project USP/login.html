<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Ultimate Student Portal</title>

    <link rel="stylesheet" href="login.css">

    <link rel="stylesheet"
        href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css">

</head>


<body>


    <div class="background-circle circle-one"></div>
    <div class="background-circle circle-two"></div>


    <main class="login-container">


            <div class="brand">

      <img src="media/usp logo-02.png" alt="">

    </div>


        <section class="login-content">


            <div class="heading">

                <h1>Welcome Back</h1>

                <p>Log in to your account</p>

                <div class="heading-line"></div>

            </div>


            <form>


                <div class="form-group">

                    <label for="userID">
                        User ID
                    </label>

                    <div class="input-box">

                        <i class="fi fi-rr-user"></i>

                        <input type="text" id="userID" name="userID" placeholder="Enter your student/instructor ID"
                            required>

                    </div>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <i class="fi fi-rr-lock"></i>

                        <input type="password" id="password" name="password" placeholder="Enter your password" required>

                        <button type="button" class="password-toggle" onclick="togglePassword()"
                            aria-label="Show password">

                            <i id="passwordIcon" class="fi fi-rr-eye-crossed"></i>

                        </button>

                    </div>


                    <div class="forgot-password">

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>

                </div>


                <button type="submit" class="login-button">

                    <span>Log In</span>

                    <i class="fi fi-rr-arrow-right"></i>

                </button>


            </form>


            <div class="or-divider">

                <span></span>

                <p>OR</p>

                <span></span>

            </div>


            <div class="signup-box">

                <p>
                    Don't have an account?
                </p>

                <a href="signup.html">

                    Sign Up

                    <i class="fi fi-rr-arrow-right"></i>

                </a>

            </div>


        </section>


        <div class="tagline">

            YOUR RESULTS. YOUR FUTURE.

        </div>


    </main>


    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const icon =
                document.getElementById("passwordIcon");


            if (password.type === "password") {

                password.type = "text";

                icon.className = "fi fi-rr-eye";

            } else {

                password.type = "password";

                icon.className = "fi fi-rr-eye-crossed";

            }

        }

    </script>


</body>

</html>
