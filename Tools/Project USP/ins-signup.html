<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instructor Sign Up</title>

    <link rel="stylesheet"
        href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css">

    <link rel="stylesheet" href="ins-signup.css">
</head>

<body>

    <!-- Background -->

    <div class="background-circle circle-one"></div>
    <div class="background-circle circle-two"></div>


    <!-- Main Container -->

    <main class="signup-container">

        <!-- Brand -->

    <div class="brand">

      <img src="media/usp logo-02.png" alt="">

    </div>


        <!-- Heading -->

        <div class="heading">

            <h1>Instructor Sign Up</h1>

            <p>
                Fill in your details to create your instructor account.
            </p>

            <div class="heading-line"></div>

        </div>


        <!-- Personal Information -->

        <section class="form-section">

            <div class="section-title">

                <div class="section-icon">
                    <i class="fi fi-rr-user"></i>
                </div>

                <h2>Personal Information</h2>

            </div>


            <div class="form-grid">

                <div class="form-group">

                    <label>Full Name</label>

                    <div class="input-box">

                        <i class="fi fi-rr-user"></i>

                        <input type="text" placeholder="Enter your full name">

                    </div>

                </div>


                <div class="form-group">

                    <label>Gender</label>

                    <div class="input-box">

                        <i class="fi fi-rr-user"></i>

                        <select>
                            <option value="" selected disabled>
                                Select your gender
                            </option>
                            <option>Male</option>
                            <option>Female</option>
                        </select>

                        <i class="fi fi-rr-angle-small-down dropdown-icon"></i>

                    </div>

                </div>


                <div class="form-group">

                    <label>Date of Birth</label>

                    <div class="input-box">

                        <i class="fi fi-rr-calendar"></i>

                        <input type="date" placeholder="Select your date of birth">

                    </div>

                </div>


                <div class="form-group">

                    <label>Blood Group</label>

                    <div class="input-box">

                        <i class="fi fi-rr-drop"></i>

                        <select>
                            <option value="" selected disabled>
                                Select your blood group
                            </option>
                            <option>A+</option>
                            <option>A-</option>
                            <option>B+</option>
                            <option>B-</option>
                            <option>AB+</option>
                            <option>AB-</option>
                            <option>O+</option>
                            <option>O-</option>
                        </select>

                        <i class="fi fi-rr-angle-small-down dropdown-icon"></i>

                    </div>

                </div>

            </div>

        </section>


        <!-- Professional Information -->

        <section class="form-section">

            <div class="section-title">

                <div class="section-icon">
                    <i class="fi fi-rr-briefcase"></i>
                </div>

                <h2>Professional Information</h2>

            </div>


            <div class="form-grid">

                <div class="form-group">

                    <label>Employee / Instructor ID</label>

                    <div class="input-box">

                        <i class="fi fi-rr-id-badge"></i>

                        <input type="text" placeholder="Enter your employee ID">

                    </div>

                </div>


                <div class="form-group">

                    <label>Designation</label>

                    <div class="input-box">

                        <i class="fi fi-rr-users"></i>

                        <input type="text" placeholder="Enter your designation">

                    </div>

                </div>


                <div class="form-group">

                    <label>Department</label>

                    <div class="input-box">

                        <i class="fi fi-rr-university"></i>

                        <select>
                            <option value="" selected disabled>
                                Select your department
                            </option>
                            <option>Computer Science and Engineering</option>
                            <option>Electrical and Electronic Engineering</option>
                            <option>Business Administration</option>
                            <option>English</option>
                            <option>Law</option>
                        </select>

                        <i class="fi fi-rr-angle-small-down dropdown-icon"></i>

                    </div>

                </div>


                <div class="form-group">

                    <label>Subject / Specialization</label>

                    <div class="input-box">

                        <i class="fi fi-rr-book"></i>

                        <input type="text" placeholder="Enter your subject or specialization">

                    </div>

                </div>


                <div class="form-group">

                    <label>Qualification</label>

                    <div class="input-box">

                        <i class="fi fi-rr-graduation-cap"></i>

                        <input type="text" placeholder="Enter your highest qualification">

                    </div>

                </div>


                <div class="form-group">

                    <label>Experience (Years)</label>

                    <div class="input-box">

                        <i class="fi fi-rr-chart-histogram"></i>

                        <input type="number" placeholder="Enter years of experience">

                    </div>

                </div>


                <div class="form-group">

                    <label>Joining Date</label>

                    <div class="input-box">

                        <i class="fi fi-rr-calendar"></i>

                        <input type="date">

                    </div>

                </div>

            </div>

        </section>


        <!-- Contact Information -->

        <section class="form-section">

            <div class="section-title">

                <div class="section-icon">
                    <i class="fi fi-rr-phone-call"></i>
                </div>

                <h2>Contact Information</h2>

            </div>


            <div class="form-grid">

                <div class="form-group">

                    <label>Phone No.</label>

                    <div class="input-box">

                        <i class="fi fi-rr-phone-call"></i>

                        <input type="tel" placeholder="Enter your phone number">

                    </div>

                </div>


                <div class="form-group">

                    <label>Email Address</label>

                    <div class="input-box">

                        <i class="fi fi-rr-envelope"></i>

                        <input type="email" placeholder="Enter your email address">

                    </div>

                </div>


                <div class="form-group full-width">

                    <label>Address</label>

                    <div class="input-box textarea-box">

                        <i class="fi fi-rr-marker"></i>

                        <textarea placeholder="Enter your full address"></textarea>

                    </div>

                </div>

            </div>

        </section>


        <!-- Account Security -->

        <section class="form-section security-section">

            <div class="section-title">

                <div class="section-icon">
                    <i class="fi fi-rr-shield-check"></i>
                </div>

                <h2>Account Security</h2>

            </div>


            <div class="form-grid">

                <div class="form-group">

                    <label>Password</label>

                    <div class="input-box">

                        <i class="fi fi-rr-lock"></i>

                        <input type="password" placeholder="Create a password">

                        <i class="fi fi-rr-eye-crossed password-icon"></i>

                    </div>

                </div>


                <div class="form-group">

                    <label>Confirm Password</label>

                    <div class="input-box">

                        <i class="fi fi-rr-lock"></i>

                        <input type="password" placeholder="Confirm your password">

                        <i class="fi fi-rr-eye-crossed password-icon"></i>

                    </div>

                </div>

            </div>


            <!-- Password Information -->

            <div class="password-info">

                <i class="fi fi-rr-info"></i>

                <span>
                    Use at least 8 characters with a combination of letters,
                    numbers and symbols.
                </span>

            </div>


            <!-- Create Account -->

            <button type="submit" class="create-button">

                <span>Create Instructor Account</span>

                <i class="fi fi-rr-arrow-right"></i>

            </button>


            <!-- Login -->

            <p class="login-text">

                Already have an account?

                <a href="login.html">
                    Log In
                </a>

            </p>

        </section>

    </main>

</body>

</html>
