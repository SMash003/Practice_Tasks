<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Sign Up | Ultimate Student Portal</title>

    <link rel="stylesheet" href="student-signup.css">

    <link rel="stylesheet"
        href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css">

</head>


<body>

    <!-- BACKGROUND -->

    <div class="background-circle circle-one"></div>
    <div class="background-circle circle-two"></div>


    <!-- SIGNUP CONTAINER -->

    <main class="signup-container">


        <!-- BRAND -->

        <div class="brand">

            <img src="media/usp logo-02.png" alt="">

        </div>


        <!-- HEADING -->

        <div class="heading">

            <h1>Student Sign Up</h1>

            <p>Fill in your details to create your student account.</p>

            <div class="heading-line"></div>

        </div>


        <!-- FORM -->

        <form class="signup-form">


            <!-- PERSONAL INFORMATION -->

            <section class="form-section">

                <div class="section-title">

                    <div class="section-icon">
                        <i class="fi fi-rr-user"></i>
                    </div>

                    <h2>Personal Information</h2>

                </div>


                <div class="form-grid">


                    <!-- FULL NAME -->

                    <div class="form-group">

                        <label for="fullName">
                            Full Name
                        </label>

                        <div class="input-box">

                            <i class="fi fi-rr-user"></i>

                            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name"
                                required>

                        </div>

                    </div>


                    <!-- GENDER -->

                    <div class="form-group">

                        <label for="gender">
                            Gender
                        </label>

                        <div class="input-box select-box">

                            <i class="fi fi-rr-venus-mars"></i>

                            <select id="gender" name="gender" required>

                                <option value="" selected disabled>
                                    Select your gender
                                </option>

                                <option value="male">
                                    Male
                                </option>

                                <option value="female">
                                    Female
                                </option>

                            </select>

                            <i class="fi fi-rr-angle-small-down dropdown-icon"></i>

                        </div>

                    </div>


                    <!-- BLOOD GROUP -->

                    <div class="form-group">

                        <label for="bloodGroup">
                            Blood Group
                        </label>

                        <div class="input-box select-box">

                            <i class="fi fi-rr-drop"></i>

                            <select id="bloodGroup" name="bloodGroup" required>

                                <option value="" selected disabled>
                                    Select your blood group
                                </option>

                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>

                            </select>

                            <i class="fi fi-rr-angle-small-down dropdown-icon"></i>

                        </div>

                    </div>

                </div>

            </section>


            <!-- ACADEMIC INFORMATION -->

            <section class="form-section">

                <div class="section-title">

                    <div class="section-icon">
                        <i class="fi fi-rr-graduation-cap"></i>
                    </div>

                    <h2>Academic Information</h2>

                </div>


                <div class="form-grid">


                    <!-- STUDENT ID -->

                    <div class="form-group">

                        <label for="studentId">
                            Student ID
                        </label>

                        <div class="input-box">

                            <i class="fi fi-rr-id-badge"></i>

                            <input type="text" id="studentId" name="studentId" placeholder="Enter your student ID"
                                required>

                        </div>

                    </div>


                    <!-- REGISTRATION -->

                    <div class="form-group">

                        <label for="registration">
                            Registration No.
                        </label>

                        <div class="input-box">

                            <i class="fi fi-rr-file"></i>

                            <input type="text" id="registration" name="registration"
                                placeholder="Enter your registration number" required>

                        </div>

                    </div>


                    <!-- DEPARTMENT -->

                    <div class="form-group">

                        <label for="department">
                            Department
                        </label>

                        <div class="input-box select-box">

                            <i class="fi fi-rr-bank"></i>

                            <select id="department" name="department" required>

                                <option value="" selected disabled>
                                    Select your department
                                </option>

                                <option value="cse">
                                    Computer Science & Engineering
                                </option>

                                <option value="eee">
                                    Electrical & Electronic Engineering
                                </option>

                                <option value="bba">
                                    Business Administration
                                </option>

                                <option value="english">
                                    English
                                </option>

                            </select>

                            <i class="fi fi-rr-angle-small-down dropdown-icon"></i>

                        </div>

                    </div>


                    <!-- SECTION -->

                    <div class="form-group">

                        <label for="section">
                            Section
                        </label>

                        <div class="input-box select-box">

                            <i class="fi fi-rr-users-alt"></i>

                            <select id="section" name="section" required>

                                <option value="" selected disabled>
                                    Select your section
                                </option>

                                <option value="a">
                                    Section A
                                </option>

                                <option value="b">
                                    Section B
                                </option>

                                <option value="c">
                                    Section C
                                </option>

                                <option value="d">
                                    Section D
                                </option>

                            </select>

                            <i class="fi fi-rr-angle-small-down dropdown-icon"></i>

                        </div>

                    </div>


                    <!-- BATCH -->

                    <div class="form-group">

                        <label for="batch">
                            Batch
                        </label>

                        <div class="input-box">

                            <i class="fi fi-rr-calendar"></i>

                            <input type="text" id="batch" name="batch" placeholder="Enter your batch (e.g. 62)"
                                required>

                        </div>

                    </div>

                </div>

            </section>


            <!-- CONTACT INFORMATION -->

            <section class="form-section">

                <div class="section-title">

                    <div class="section-icon">
                        <i class="fi fi-rr-phone-call"></i>
                    </div>

                    <h2>Contact Information</h2>

                </div>


                <div class="form-grid">


                    <!-- PHONE -->

                    <div class="form-group">

                        <label for="phone">
                            Phone No.
                        </label>

                        <div class="input-box">

                            <i class="fi fi-rr-phone-call"></i>

                            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>

                        </div>

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <div class="input-box">

                            <i class="fi fi-rr-envelope"></i>

                            <input type="email" id="email" name="email" placeholder="Enter your email address" required>

                        </div>

                    </div>


                    <!-- ADDRESS -->

                    <div class="form-group full-width">

                        <label for="address">
                            Address
                        </label>

                        <div class="input-box textarea-box">

                            <i class="fi fi-rr-marker"></i>

                            <textarea id="address" name="address" placeholder="Enter your full address"
                                required></textarea>

                        </div>

                    </div>

                </div>

            </section>


            <!-- ACCOUNT SECURITY -->

            <section class="form-section">

                <div class="section-title">

                    <div class="section-icon">
                        <i class="fi fi-rr-shield-check"></i>
                    </div>

                    <h2>Account Security</h2>

                </div>


                <div class="form-grid">


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-box">

                            <i class="fi fi-rr-lock"></i>

                            <input type="password" id="password" name="password" placeholder="Create a password"
                                minlength="8" required>

                            <i class="fi fi-rr-eye-crossed password-icon"></i>

                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="input-box">

                            <i class="fi fi-rr-lock"></i>

                            <input type="password" id="confirmPassword" name="confirmPassword"
                                placeholder="Confirm your password" minlength="8" required>

                            <i class="fi fi-rr-eye-crossed password-icon"></i>

                        </div>

                    </div>

                </div>


                <!-- PASSWORD NOTE -->

                <div class="password-note">

                    <i class="fi fi-rr-info"></i>

                    <span>
                        Use at least 8 characters with a combination of letters, numbers and symbols.
                    </span>

                </div>

            </section>


            <!-- CREATE ACCOUNT -->

            <button type="submit" class="create-account">

                <span>
                    Create Student Account
                </span>

                <i class="fi fi-rr-arrow-right"></i>

            </button>

        </form>


        <!-- LOGIN -->

        <div class="login-text">

            Already have an account?

            <a href="login.html">
                Log In
            </a>

        </div>

    </main>

</body>

</html>
